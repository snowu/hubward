name: Deploy page
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Pages serves assets with max-age=600 and no way to set headers, so a
      # phone — a home-screen one especially — keeps running yesterday's
      # script. Stamping the commit onto every local asset URL makes each
      # deploy a new URL, which no cache can hold on to.
      - name: Cache-bust local assets
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s#\(href\|src\)=\"\(style.css\|app.js\|appearance.js\|install.js\|icon.svg\|apple-touch-icon.png\|icon-192.png\|manifest.webmanifest\)\"#\1=\"\2?v=$v\"#g" web/index.html
          sed -i "s#from \"./cache.js\"#from \"./cache.js?v=$v\"#" web/app.js
          sed -i "s#from \"./trips.js\"#from \"./trips.js?v=$v\"#" web/app.js
          sed -i "s#from \"./tracking.js\"#from \"./tracking.js?v=$v\"#" web/app.js
          sed -i "s#from \"./directions.js\"#from \"./directions.js?v=$v\"#" web/app.js
          sed -i "s#from \"./emt-account.js\"#from \"./emt-account.js?v=$v\"#" web/app.js
          grep -n "?v=" web/index.html web/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
